[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sevenzip2hash"
version = "1.0.0"
description = "Extract hashcat-compatible hashes from 7z archives. Pure Python standard library, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AALCbaka" }]
keywords = ["hashcat", "7z", "7-zip", "password-recovery", "forensics", "security"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://github.com/AALCbaka/sevenzip2hash"

[project.scripts]
sevenzip2hash = "sevenzip2hash:_main"

[tool.setuptools]
py-modules = ["sevenzip2hash"]
